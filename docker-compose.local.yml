services:
  tts:
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
    command: ['--watch']
    environment:
      CONTENT_DIR: /content/posts
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
      VOICES_DIR: /voices
    volumes:
      - ../personal-content:/content:ro
      - ./apps/web/public/audio:/output
      - ./scripts:/app/scripts:ro
      - tts_audio_cache:/cache
      - tts_voice_models:/voices

  web:
    build:
      context: .
      dockerfile: docker/web.local.Dockerfile
    command:
      - sh
      - -c
      - |
        node --import tsx/esm scripts/watch-content.ts &
        exec pnpm --dir apps/web dev --host 0.0.0.0 --port 3000
    environment:
      CONTENT_DIR: /content
      WATCH_POLLING: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/content:/app/apps/web/content
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/content.config.ts:/app/apps/web/content.config.ts:ro
      - ./apps/web/nuxt.config.ts:/app/apps/web/nuxt.config.ts:ro
      - ./scripts:/app/scripts:ro
      - ../personal-content:/content:ro
      - web_image_cache:/app/.cache/images

  proxy:
    image: caddy:2-alpine
    volumes:
      - ./docker/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:${PROXY_PORT:-8081}:80'
    depends_on:
      - web
      - api

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATA_DIR: /data
      BETTER_AUTH_SECRET: local-development-only-secret-not-for-production
      PUBLIC_URL: http://localhost:${PROXY_PORT:-8081}
      TRUSTED_ORIGINS: http://localhost:${PROXY_PORT:-8081}
      ALTCHA_HMAC_KEY: local-development-only
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
    volumes:
      - local_sqlite_data:/data

volumes:
  local_sqlite_data:
  tts_audio_cache:
    name: personal-site_tts_audio_cache
    external: true
  tts_voice_models:
    name: personal-site_tts_voice_models
    external: true
  web_image_cache:
    name: personal-site_web_image_cache
    external: true
