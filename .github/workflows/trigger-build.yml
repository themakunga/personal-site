name: Publish Runtime Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
            target: web
          - image: renderer
            file: docker/web.Dockerfile
            target: renderer
          - image: api
            file: docker/api.Dockerfile
            target: ''
          - image: tts
            file: docker/tts.Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/themakunga/personal-site-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  dispatch:
    name: Deploy published runtime images
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DISPATCH_TOKEN: ${{ secrets.CONTENT_REPO_DISPATCH_TOKEN }}
    steps:
      - name: Trigger content deployment after all images are available
        if: env.DISPATCH_TOKEN != ''
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TheMakunga/personal-content/dispatches \
            -d "{\"event_type\":\"trigger-build\",\"client_payload\":{\"source_sha\":\"$SOURCE_SHA\"}}"
      - name: Report manual deployment requirement
        if: env.DISPATCH_TOKEN == ''
        run: echo '::notice::CONTENT_REPO_DISPATCH_TOKEN is not configured. Images are published; run make deploy on the server manually.'
