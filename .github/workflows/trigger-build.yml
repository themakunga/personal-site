name: Trigger Content Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    name: Dispatch to personal-content
    runs-on: ubuntu-latest

    steps:
      - name: Trigger build in personal-content
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CONTENT_REPO_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/TheMakunga/personal-content/dispatches \
            -d '{"event_type":"trigger-build","client_payload":{"source_sha":"${{ github.sha }}"}}'
