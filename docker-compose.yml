services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      - web

  web:
    image: ghcr.io/themakunga/personal-site-web:${SITE_IMAGE_TAG:?Set SITE_IMAGE_TAG to a published sha tag}
    volumes:
      - site_public:/srv:ro
    networks:
      - edge
      - backend
    restart: unless-stopped
    depends_on:
      - api

  api:
    image: ghcr.io/themakunga/personal-site-comments-api:${SITE_IMAGE_TAG:?Set SITE_IMAGE_TAG to a published sha tag}
    networks:
      - backend
      - edge
    volumes:
      - sqlite_data:/data
    environment:
      - DATA_DIR=/data
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set a persistent random Better Auth secret}
      - PUBLIC_URL=${PUBLIC_URL}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - ALTCHA_HMAC_KEY=${ALTCHA_HMAC_KEY}
    # Admin port exposed only on loopback
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped

  renderer:
    image: ghcr.io/themakunga/personal-site-renderer:${SITE_IMAGE_TAG:?Set SITE_IMAGE_TAG to a published sha tag}
    profiles: [tools]
    environment:
      NUXT_TELEMETRY_DISABLED: '1'
    volumes:
      - ../personal-content:/content:ro
      - ./apps/web/public/audio:/app/apps/web/public/audio:ro
      - web_image_cache:/app/.cache/images
      - site_public:/publish

  tts:
    image: ghcr.io/themakunga/personal-site-tts:${SITE_IMAGE_TAG:?Set SITE_IMAGE_TAG to a published sha tag}
    profiles: [tools]
    environment:
      CONTENT_DIR: /content/posts
      OUTPUT_DIR: /output
      CACHE_DIR: /cache
      VOICES_DIR: /voices
    volumes:
      - ../personal-content:/content:ro
      - ./apps/web/public/audio:/output
      - tts_audio_cache:/cache
      - tts_voice_models:/voices

volumes:
  sqlite_data:
  site_public:
  web_image_cache:
    name: personal-site_web_image_cache
    external: true
  tts_audio_cache:
    name: personal-site_tts_audio_cache
    external: true
  tts_voice_models:
    name: personal-site_tts_voice_models
    external: true

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
